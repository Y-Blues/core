[project]
name = "ycappuccino-core"
version = "0.1.0"
description = "YCappuccino framework: loads bundles and generates iPOPO components from annotated classes"
requires-python = ">=3.10"
dependencies = [
    "ycappuccino-api",
    "iPOPO>=3.0",
    "PyYAML>=6.0",
]

[project.scripts]
ycappuccino = "ycappuccino.core.runner:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ycappuccino.core"
module-root = "src/main/python"

[tool.uv.sources]
ycappuccino-api = { path = "../api", editable = true }
